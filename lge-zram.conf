# lge-zramd 配置文件；启动时读取一次，不支持热加载，省略项使用默认值。
# 文件要求：root:root、0644、u:object_r:vendor_configs_file:s0。
# 旧版时间、PSI、充电及用户态水位触发参数已退役，不再参与回写策略。

# 允许使用回写后端；不代表立即向 UFS 写入。
enable_writeback=1
# 启用内核需求策略；实际写入还须通过用户态预算与状态检查。
demand_enabled=1
# zsmalloc 实际物理池达到高水位时激活需求，降至低水位时解除。
# 单位 MiB；不是 zram 逻辑容量或 UFS 已用容量。
pool_low_mib=512
pool_high_mib=768
# 冷页最小年龄，单位秒；基于 zram 访问，不等同于应用后台时间。
cold_age_seconds=60
# 单笔回写源页面数据量上限，单位 MiB；不等于实际释放的物理 RAM。
demand_batch_mib=4
# 单笔最多扫描的页面槽位数量，用于限制扫描开销。
demand_scan_limit=4096
# 等待阶段日志间隔，单位秒；不是回写定时器。
wait_log_interval_seconds=30

# 当前控制器对象内的滚动写入预算，单位 MiB；不再使用持久化磨损账本。
# 已知结果按提交量计费，未知结果按整批计费并停止；已有数据回读不受限。
# CLOCK_BOOTTIME 包含休眠，15 分钟桶只延后、不提前释放。
# 控制器对象重新创建后历史清空；不提供跨进程/设备重启的每日硬上限。
daily_mib=1024
# 通过 F2FS 文件固定物理区段建立 DM 后端；底层为 /data/extm/file。
# 最终存储介质是 UFS；DM 是块映射，不是文件系统挂载。
backend=dm_extm_file
# 通过 ioctl 请求内核执行受限回写。
request_backend=ioctl
# 回写后端目标大小，单位 MiB；修改不会在线扩容现有后端。
backing_mib=1024
# 初始化容量请求；当前定制内核实际将逻辑容量固定为物理 RAM 的 1:1。
# 这里的 1 不是最终容量为 1 字节，也不是容量倍率。
disksize_bytes=1
# 后端准备流程要求的数据分区可用空间，单位 MiB。
min_data_free_mib=2048
# 启动阶段等待数据分区的时间限制，单位秒。
data_wait_seconds=60

# 以下为 VM 参数，保留原有启动应用流程。
# 交换倾向；180 不是百分比，也不是 UFS 回写开关。
vm_swappiness=180
# 关闭交换读入的聚簇预读。
vm_page_cluster=0
# 调整回收水位间距，以万分之一为单位；200 对应 2%。
# 不是固定预留全部 RAM 的 2%。
vm_watermark_scale_factor=200
# 额外空闲内存水位调节值，单位 KiB；65536 KiB = 64 MiB。
vm_extra_free_kbytes=65536
# min_free_kbytes 绝对目标，单位 KiB；0 表示改用下方基线倍率。
# 若设为非零绝对目标，须同时将 vm_minfree_mult 设为 0。
vm_min_free_kbytes=0
# 保留 LG 原厂倍率思路：首次读取的 min_free_kbytes 基线乘以 2。
# 本次启动保存基线与目标，后续应用不反复翻倍；不是 zram 容量翻倍。
vm_minfree_mult=2
# 允许虚拟内存过量承诺，不代表物理内存无限。
vm_overcommit_memory=1
# 关闭 laptop_mode；不是 zram 回写开关。
vm_laptop_mode=0
