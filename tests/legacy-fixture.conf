# Migrated from backup f9e0b25e401e53f9e24e2ffbdc581ec1236261087db8876ca5d3c3db97940ecc.
# Required deployment metadata: 0:0 0644 u:object_r:vendor_configs_file:s0.
# Preserve user profile intensity: batch 16 MiB, daily 1024 MiB, idle observation 60 seconds; no live reload.
# Omitted supported keys use defaults; status/check-config show disk snapshot, not running state.
enable_writeback=1
# Auto falls back ONLY on STATUS ENOTTY; ioctl permission/reply failures pause.
# Candidate deployment needs matching kernel AND ioctl policy. Never refill global quota.
request_backend=auto
# Opt-in event runtime; old synchronous entry remains the shipped default.
runtime_event_enabled=0
psi_enabled=0
runtime_idle_sample_seconds=30
runtime_active_sample_seconds=2
runtime_max_resync_seconds=60
runtime_health_retry_seconds=30
# Conservative PSI example; inactive while psi_enabled=0.
psi_threshold_us=500000
psi_window_us=10000000
idle_observation_seconds=60
# Read-only sampling interval in seconds.
sample_interval_seconds=2
# All policies load once from /vendor/etc/lge-zram.conf at startup; next boot applies edits.
# Independent tracks; triggers coalesce into ONE reservation/request. Watermark wins over time.
time_trigger_enabled=1
time_trigger_interval_seconds=300
watermark_trigger_enabled=1
# Resident logical bytes = orig_data_size - bd_count*4096.
# Ratio uses actual kernel disksize (not compressed RAM usage or configured disksize).
# high/low defaults are 80/50; low < high. Every actual attempt resets both track intervals.
watermark_high_pct=80
watermark_low_pct=50
# Backend full is a normal stop: reaching low is not guaranteed.
# NO_PROGRESS is process-only, shared by both tracks; elapsed time alone cannot retry.
# Retry needs >= previous planned pages of candidate/resident growth or backing space recovery.
no_progress_retry_seconds=600
wait_log_interval_seconds=30
batch_mib=16
daily_mib=1024
min_mem_available_kib=524288
# Cold backing/backend and safety; not a live resize request.
backend=dm_extm_file
backing_mib=1024
# Kernel CONFIG_ZRAM_HARDCODE_DISKSIZE ignores this request: physical RAM 1:1.
disksize_bytes=1
min_data_free_mib=2048
data_wait_seconds=60
# Boot VM: existing two-phase application and boot-completed contract unchanged.
vm_swappiness=180
vm_page_cluster=0
vm_watermark_scale_factor=200
vm_extra_free_kbytes=65536
vm_min_free_kbytes=0
vm_minfree_mult=2
vm_overcommit_memory=1
vm_laptop_mode=0

watermark_charging_batch_mib=8
watermark_charging_idle_observation_seconds=30
watermark_charging_min_interval_seconds=30
watermark_battery_batch_mib=2
watermark_battery_idle_observation_seconds=60
watermark_battery_min_interval_seconds=120
